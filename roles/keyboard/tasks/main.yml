---
# ===========================================================================
# keyboard -- custom XKB layout + GNOME input source configuration.
#
# TWO HALVES, WITH DIFFERENT PRIVILEGE REQUIREMENTS. This is the subtlety
# that makes this role worth reading carefully:
#
#   1. The symbols file lives under /usr/share and needs ROOT.
#   2. The GNOME settings live in YOUR dconf database and must NOT be root.
#      Running them as root writes root's settings: no error, no effect,
#      and very confusing to debug.
#
# WHY NO setxkbmap / xkbcomp ANYWHERE IN THIS ROLE:
# Those are X11 tools. Ubuntu 26.04 is Wayland-only -- there is no Xorg
# session to talk to -- and this machine is already on Wayland today. All
# desktop configuration therefore goes through gsettings/dconf, which is the
# supported path on both.
# ===========================================================================

# ------------------------- 1. the layout (root) ---------------------------

- name: Install the custom XKB symbols file
  ansible.builtin.copy:
    src: custom
    dest: "{{ keyboard_custom_symbols_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  # `copy` compares checksums, so this is a no-op once the file matches.
  # No package owns this path, so nothing will overwrite it on upgrade.
  register: keyboard_symbols
  tags: [keyboard]

- name: Note that a re-login is required for a changed layout
  # Purely informational. GNOME compiles the keymap when your session starts,
  # so an edited symbols file does not take effect until you log back in.
  # There is no supported way to force that from a script on Wayland.
  ansible.builtin.set_fact:
    keyboard_relogin_required: "{{ keyboard_symbols.changed }}"
  tags: [keyboard]

# ---------------- 2. is there actually a GNOME desktop here? --------------
# Found by testing in a clean VM: on a machine with no desktop (a server
# image, a container, or a minimal install) there is no `dconf` binary and no
# session bus, and the tasks below fail hard with
#   "Failed to find required executable dconf".
#
# The symbols file above is still worth installing everywhere -- it is inert
# until a desktop uses it -- but the GNOME settings genuinely cannot apply, so
# we detect and skip rather than fail.

- name: Detect whether this machine has a GNOME desktop
  ansible.builtin.stat:
    path: /usr/bin/gnome-shell
  register: keyboard_gnome_shell
  tags: [keyboard]

- name: Install dconf-cli
  # community.general.dconf shells out to the `dconf` binary, which lives in
  # this package. Present on a stock Ubuntu desktop, but make it explicit so
  # a minimal desktop install cannot fail here.
  ansible.builtin.apt:
    name: dconf-cli
    state: present
  become: true
  when: keyboard_gnome_shell.stat.exists
  tags: [keyboard]

- name: Explain why the GNOME settings are being skipped
  ansible.builtin.debug:
    msg: >-
      No GNOME desktop detected (/usr/bin/gnome-shell is absent), so the input
      sources and keyboard shortcut were not configured. The custom layout
      file itself WAS installed and will be picked up if a desktop is added
      later.
  when: not keyboard_gnome_shell.stat.exists
  tags: [keyboard]

# ---------------------- 3. GNOME settings (NOT root) ----------------------
# MODULE CHOICE: `gsettings` via command, NOT community.general.dconf.
#
# This one is counter-intuitive, so it is worth being precise about. The dconf
# module looks like the right tool and was used here originally. It is not,
# because it CORRUPTS these particular values.
#
# GNOME's input-sources/sources key has GVariant type a(ss) -- an array of
# TUPLES. Ansible sends the correct text:
#     [('xkb', 'custom'), ('xkb', 'es')]
# but community.general 13.3.0 stores:
#     [['xkb', 'custom'], ['xkb', 'es']]
# -- arrays, not tuples. GNOME cannot read that, so `gsettings get` returns an
# empty list and your input sources silently vanish. Older community.general
# (the one Ubuntu bundles) does not do this, so it passes on a stock machine
# and fails on one with a newer collection installed. That is the worst kind
# of bug, and the reason we do not depend on the module at all.
#
# `gsettings` is GNOME's own tool. It validates against the schema, so a bad
# value fails loudly instead of corrupting the setting silently.
#
# IDEMPOTENCY: `command` is not idempotent by itself, so each setting is read
# first and only written when it differs, comparing with whitespace stripped.
#
# See roles/keyboard/defaults/main.yml for why the values carry an explicit
# GVariant type annotation. That detail is load-bearing, not cosmetic.

- name: Read the current GNOME keyboard settings
  ansible.builtin.command: "gsettings get {{ item.schema }} {{ item.key }}"
  become: false
  loop: "{{ keyboard_gsettings }}"
  loop_control:
    label: "{{ item.key }}"
  register: keyboard_current
  changed_when: false     # reading changes nothing
  check_mode: false       # safe to run during --check; it only reads
  when: keyboard_gnome_shell.stat.exists
  tags: [keyboard]

- name: Apply the GNOME keyboard settings
  # argv form avoids any shell quoting question around the GVariant literal,
  # which contains quotes, parentheses and angle brackets.
  ansible.builtin.command:
    argv:
      - gsettings
      - set
      - "{{ item.item.schema }}"
      - "{{ item.item.key }}"
      - "{{ item.item.value }}"
  become: false
  loop: "{{ keyboard_current.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - keyboard_gnome_shell.stat.exists
    # Strip the "@a(ss) " / "@as " type prefix back off, then compare with
    # all whitespace removed so we do not depend on gsettings and Jinja
    # spacing their output identically.
    - (item.stdout | default('') | trim | replace(' ', ''))
      != (item.item.value | regex_replace('^@\\S+ ', '') | replace(' ', ''))
  changed_when: true      # only reached when the value actually differs
  tags: [keyboard]
