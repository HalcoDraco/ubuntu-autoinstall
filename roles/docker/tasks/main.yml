---
# ===========================================================================
# docker -- Docker Engine (NOT Docker Desktop) from Docker's official repo.
#
# ROLE CHOICE: hand-rolled rather than geerlingguy.docker.
# That role is well maintained, but it carries Debian/RedHat/Fedora branching
# we do not need, and its per-distro version logic is exactly the kind of
# thing that breaks on a release as new as 26.04. This is ~50 lines we fully
# control, with no galaxy dependency to audit on every bump. For a repo whose
# entire purpose is surviving Ubuntu upgrades, fewer moving parts wins.
#
# SECURITY NOTE, stated plainly rather than buried: adding your user to the
# "docker" group grants effective root. Any member can run
# `docker run -v /:/host ...` and edit any file on the system. This is the
# standard trade-off for using docker without sudo, and it is what you asked
# for -- but it is worth knowing.
# ===========================================================================

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  tags: [docker]

- name: Check that Docker publishes a repo for this Ubuntu release
  # Docker builds per-codename repositories, and a brand-new Ubuntu release
  # can exist for weeks before Docker publishes for it. Without this check the
  # failure mode is a cryptic "404 Not Found" from apt AFTER we have written a
  # broken source file -- which then breaks every later apt command.
  # Checking first means we skip cleanly instead.
  ansible.builtin.uri:
    url: "{{ docker_repo_uri }}/dists/{{ ansible_facts['distribution_release'] }}/Release"
    method: HEAD
    status_code: [200, 403, 404]
  register: docker_repo_check
  changed_when: false
  check_mode: false
  failed_when: false
  tags: [docker]

- name: Explain that Docker has no repo for this release yet
  ansible.builtin.debug:
    msg: >-
      Docker does not publish an apt repository for
      '{{ ansible_facts['distribution_release'] }}' yet
      (HTTP {{ docker_repo_check.status | default('unknown') }}).
      Skipping Docker rather than writing a source file that would break apt.
      Re-run this playbook once Docker publishes for this release.
  when: docker_repo_check.status | default(0) != 200
  tags: [docker]

# Everything below only runs when the repo really exists.
- name: Note that Docker's install was skipped in check mode
  ansible.builtin.debug:
    msg: >-
      Dry run: the Docker repo does not exist on this machine yet, so the
      packages cannot be seen and the service/group steps are skipped too.
      A real run adds the repo first and proceeds normally.
  when:
    - ansible_check_mode
    - docker_repo_check.status | default(0) == 200
  tags: [docker]

- name: Install Docker Engine
  when: docker_repo_check.status | default(0) == 200
  tags: [docker]
  block:

    - name: Fetch Docker's package signing key
      ansible.builtin.get_url:
        url: "{{ docker_signing_key_url }}"
        dest: "{{ docker_keyring_path }}"
        mode: "0644"
        owner: root
        group: root
      become: true

    - name: Add the Docker apt repository
      # template, not deb822_repository -- see roles/chrome for the full
      # reasoning (deb822_repository needs ansible-core 2.15+, absent on 22.04).
      ansible.builtin.template:
        src: docker.sources.j2
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
      become: true
      register: docker_repo

    - name: Install Docker Engine packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        install_recommends: false
        update_cache: "{{ docker_repo.changed }}"
      become: true
      # CHECK-MODE ARTEFACT, not a real problem:
      # in --check the repo file above was not actually written and apt's cache
      # was not refreshed, so this package genuinely is not in the cache yet and
      # apt fails with "No package matching". Skip it during a dry run on a
      # machine that does not have the repo yet, and say so, rather than letting
      # `make check` fail on a fresh machine.
      when: not (ansible_check_mode and docker_repo.changed)

    - name: Ensure the docker service is enabled and running
      # MODULE CHOICE: systemd rather than `command: systemctl start docker`.
      # The module is idempotent and reports "ok" when the service is already
      # in the desired state, which a raw command could not do.
      #
      # NOTE the module name: `systemd`, not `systemd_service`. The latter is
      # the newer name but only exists from ansible-core 2.17, so it fails
      # outright on 22.04's ansible 2.10. `systemd` works on every version.
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
      become: true
      # Same dry-run artefact: in --check the package was not installed, so
      # the service unit does not exist yet and this would fail with
      # "Could not find the requested service docker".
      when: not (ansible_check_mode and docker_repo.changed)

    - name: Add the user to the docker group - {{ docker_user }}
      # append: true is essential. Without it, this REPLACES all of the
      # user's supplementary groups -- which would silently strip sudo, and
      # is a genuinely dangerous mistake to make on your own machine.
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true
      become: true
      # Dry run: the "docker" group is created by the package, which was not
      # installed, so this would fail on a nonexistent group.
      when: not (ansible_check_mode and docker_repo.changed)
      register: docker_group

    - name: Record whether a re-login is needed for group membership
      ansible.builtin.set_fact:
        docker_relogin_required: "{{ docker_group.changed | default(false) }}"
