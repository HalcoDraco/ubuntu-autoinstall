---
# Docker's official APT repository. This one DOES need the Ubuntu codename,
# which is exactly why it is written as a variable and never as a literal:
#   suites: "{{ ansible_facts['distribution_release'] }}"
# On noble that resolves to "noble"; on 26.04 it resolves to that release's
# codename with no edit to this repo.
docker_repo_uri: "https://download.docker.com/linux/ubuntu"
docker_signing_key_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_keyring_path: "/etc/apt/keyrings/docker.asc"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
# The user to add to the "docker" group. Defaults to whoever is running the
# playbook, which under ansible-pull is you, not root.
docker_user: "{{ ansible_facts['user_id'] }}"
