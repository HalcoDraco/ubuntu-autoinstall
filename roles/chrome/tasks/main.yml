---
# ===========================================================================
# chrome -- Google Chrome from Google's own APT repository.
#
# WHY A ROLE AND NOT A LINE IN apt_packages:
# Chrome is not in Ubuntu's repositories. It needs a third-party repo and a
# signing key, which is real logic -- exactly the line I drew for VLC.
#
# THE IDEMPOTENCY TRAP (this is the interesting part):
# The google-chrome-stable package rewrites its own apt source file. Its
# postinst, and a daily cron job at /opt/google/chrome/cron/google-chrome,
# re-add the repository unless told not to. If we manage the source file
# ourselves without disabling that, Chrome silently rewrites it and this role
# reports "changed" on every single run, forever.
#
# The fix is /etc/default/google-chrome with repo_add_once="false", which is
# Google's own documented opt-out. We write it BEFORE installing the package
# so the postinst sees it on first install.
# ===========================================================================

- name: Ensure the apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  tags: [chrome]

- name: Fetch Google's package signing key
  ansible.builtin.get_url:
    url: "{{ chrome_signing_key_url }}"
    dest: "{{ chrome_keyring_path }}"
    mode: "0644"
    owner: root
    group: root
  become: true
  # get_url is idempotent: with the default force=false it issues a
  # conditional request and only reports "changed" if the key actually
  # changed upstream. No creates:/changed_when: gymnastics needed.
  tags: [chrome]

- name: Tell the Chrome package not to manage its own apt source
  # Must come BEFORE the package is installed, or the postinst adds a second,
  # duplicate source file on first install.
  ansible.builtin.copy:
    dest: /etc/default/google-chrome
    mode: "0644"
    owner: root
    group: root
    content: |
      # Managed by ubuntu-autoinstall (roles/chrome).
      # The apt repository for Chrome is defined by Ansible in
      # /etc/apt/sources.list.d/google-chrome.sources. These two settings stop
      # the Chrome package from re-adding it behind Ansible's back, which
      # would make this role report a change on every run.
      repo_add_once="false"
      repo_reenable_on_distupgrade="false"
  become: true
  tags: [chrome]

- name: Add the Google Chrome apt repository
  # MODULE CHOICE: template, not deb822_repository and not apt_repository.
  #
  # This looks like the wrong tool at first glance -- Ansible HAS a module for
  # apt repositories. Here is why we write the file ourselves anyway:
  #
  #   * apt_repository writes the deprecated one-line format that APT 3
  #     (Ubuntu 26.04) warns about. Ruled out.
  #   * deb822_repository writes the modern format, but it requires
  #     ansible-core 2.15+. Ubuntu 22.04 ships ansible 2.10, so that module
  #     does not exist there and this role would fail outright on 22.04.
  #
  # A template has neither problem: it produces the modern deb822 format on
  # EVERY Ansible version, from 22.04's 2.10 through 26.04's. Since this repo
  # must survive Ubuntu upgrades, portability across the Ansible that each
  # release happens to ship matters more than using the purpose-built module.
  #
  # We lose nothing on idempotency: template compares checksums, so it is a
  # no-op when the file already matches.
  ansible.builtin.template:
    src: google-chrome.sources.j2
    dest: /etc/apt/sources.list.d/google-chrome.sources
    owner: root
    group: root
    mode: "0644"
  become: true
  register: chrome_repo
  tags: [chrome]

- name: Remove any legacy one-line Chrome source
  # If Chrome's postinst ever ran before we set repo_add_once=false, it left a
  # google-chrome.list behind. Having both that and our .sources file makes
  # apt warn about a duplicate repository on every update.
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/google-chrome.list
    state: absent
  become: true
  tags: [chrome]

- name: Install Google Chrome
  ansible.builtin.apt:
    name: "{{ chrome_package }}"
    state: present
    install_recommends: false
    # Refresh the package index only when the repo definition just changed.
    # Unconditionally updating the cache here would slow every run down for
    # no reason.
    update_cache: "{{ chrome_repo.changed }}"
  become: true
  # CHECK-MODE ARTEFACT, not a real problem:
  # in --check the repo file above was not actually written and apt's cache
  # was not refreshed, so this package genuinely is not in the cache yet and
  # apt fails with "No package matching". Skip it during a dry run on a
  # machine that does not have the repo yet, and say so, rather than letting
  # `make check` fail on a fresh machine.
  when: not (ansible_check_mode and chrome_repo.changed)
  tags: [chrome]

- name: Note that Chrome's install was skipped in check mode
  ansible.builtin.debug:
    msg: >-
      Dry run: this run would add or modify the Google Chrome repo file, and
      --check never actually writes it or refreshes apt's cache. So the
      package cannot be checked against it here. A real run writes the repo
      first, then installs normally. (If Chrome is already installed, a real
      run leaves it alone -- state: present never upgrades.)
  when: ansible_check_mode and chrome_repo.changed
  tags: [chrome]
