---
# ---------------------------------------------------------------------------
# host_vars/example-laptop.yml -- TEMPLATE for the laptop.
#
# TO USE: rename this file to exactly match the laptop's hostname, i.e. the
# output of `hostname` on that machine. For example, if `hostname` prints
# "pablo-thinkpad", the file must be host_vars/pablo-thinkpad.yml.
#
# If the name does not match, this file is ignored and host_vars/default.yml
# is used instead -- which is also safe, just less specific.
# ---------------------------------------------------------------------------

# No NVIDIA GPU: the entire nvidia role is skipped on this machine.
nvidia_gpu_present: false

# Example of other things you might want to differ on a laptop:
# install_docker: false
# apt_packages:
#   - vlc
#   - tlp          # laptop power management, pointless on a desktop
