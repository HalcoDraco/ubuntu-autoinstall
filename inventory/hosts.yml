---
# ---------------------------------------------------------------------------
# Inventory: the list of machines Ansible can talk to.
#
# This repo configures the machine it is running ON, so the inventory contains
# exactly one entry: localhost, with connection "local" (talk to yourself
# directly, do not open an SSH connection to yourself).
#
# WHY NOT ONE ENTRY PER MACHINE?
# The obvious design is to list "Niaura-linux" and "my-laptop" here and let
# Ansible auto-load host_vars/<hostname>.yml. I deliberately did not do that,
# for two reasons:
#
#   1. ansible-pull ALWAYS limits the run to "localhost,<fqdn>,127.0.0.1"
#      (see ansible/cli/pull.py). If both "localhost" and "Niaura-linux"
#      were listed here, both would match that limit and the whole playbook
#      would run TWICE on your desktop.
#
#   2. A freshly installed machine has whatever hostname you typed into the
#      installer. If that name is not in this file, ansible-pull matches
#      nothing and silently does nothing -- the worst possible failure mode
#      for a tool whose entire job is "set up a brand new machine".
#
# Instead, local.yml loads host_vars/<hostname>.yml explicitly, falling back to
# host_vars/default.yml. You still get per-machine variance via host_vars (no
# forked playbooks), and an unknown machine gets sane defaults instead of a
# silent no-op. See the README section "Why the inventory is just localhost".
# ---------------------------------------------------------------------------
all:
  hosts:
    localhost:
      ansible_connection: local
      # Use the same interpreter Ansible itself runs under. Ubuntu always has
      # /usr/bin/python3; being explicit avoids discovery warnings.
      ansible_python_interpreter: /usr/bin/python3
