---
# ===========================================================================
# local.yml -- the entry point.
#
# This is the file `ansible-pull` runs by default (that is why it is called
# local.yml and lives at the repo root; ansible-pull looks for exactly this
# name). It is also what `make run` and bootstrap.sh execute.
#
# ANSIBLE VOCABULARY, in the order you meet it below:
#   play      - a block matching some hosts to some work. This file has one.
#   hosts     - which machines from the inventory this play targets.
#   pre_tasks - tasks that run BEFORE any role. Used here for sanity checks.
#   roles     - reusable bundles of tasks. One per thing we configure.
#   tags      - labels that let you run part of the playbook:
#                 ansible-playbook local.yml --tags docker
#   become    - "escalate privileges" i.e. run this bit with sudo.
# ===========================================================================

- name: Configure an Ubuntu desktop from scratch
  hosts: all
  # The inventory contains only localhost, so "all" means "this machine".
  # See inventory/hosts.yml for why it is built that way.

  gather_facts: true
  # Collects facts about the machine (ansible_facts['distribution_release'], hostname,
  # CPU, etc.) before running anything. We depend on several of these -- most
  # importantly ansible_facts['distribution_release'], which is how we stay
  # version-agnostic instead of hardcoding "noble" or "resolute".

  become: false
  # DEFAULT TO NOT ROOT. This is deliberate and it is the single most important
  # line in this file.
  #
  # Desktop configuration (gsettings/dconf) MUST run as your own user, because
  # those settings live in your user's dconf database and need your session's
  # D-Bus. Running them as root writes root's settings, which does nothing
  # visible and is maddening to debug.
  #
  # So: root is opt-in, per task, via `become: true`. Never play-wide.
  #
  # CONSEQUENCE: run this playbook AS YOURSELF with -K (prompt for the sudo
  # password), NOT as `sudo ansible-playbook`. `become: false` cannot climb
  # back down to your user from root -- if you start as root, the desktop
  # tasks are silently wrong. The README repeats this warning.

  pre_tasks:
    # `tags: always` means these run even when you filter with --tags docker.
    # Without it, `--tags docker` would skip loading host_vars and the run
    # would use the wrong variables.

    - name: Verify we are running on Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
        fail_msg: >-
          This playbook targets Ubuntu only, but this machine reports
          '{{ ansible_facts['distribution'] }}'. Refusing to continue rather than
          guess at package names.
        success_msg: "Ubuntu {{ ansible_facts['distribution_version'] }} ({{ ansible_facts['distribution_release'] }}) detected."
      tags: [always]

    - name: Load per-machine variables
      # This is the mechanism described in inventory/hosts.yml: we load
      # host_vars/<hostname>.yml ourselves rather than relying on Ansible's
      # automatic host_vars loading, so that an unknown machine still works.
      #
      # first_found returns the first file in the list that exists, so a
      # machine with no file of its own falls back to default.yml.
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.first_found', candidate_var_files) }}"
      vars:
        candidate_var_files:
          - "host_vars/{{ ansible_facts['hostname'] }}.yml"
          - "host_vars/default.yml"
      tags: [always]

    # ---------------------------------------------------------------------
    # WORK AROUND sudo-rs ON UBUNTU 26.04
    #
    # 26.04 ships sudo-rs (a Rust reimplementation) as the default sudo. It
    # does not reproduce the custom prompt Ansible passes with -p; it wraps it:
    #
    #   Ansible asks for:  [sudo via ansible, key=XXX] password:
    #   sudo-rs emits:     [sudo: [sudo via ansible, key=XXX] password:] Password:
    #
    # Ansible matches the prompt with startswith(), so it never matches and
    # EVERY privileged task fails with
    #   "Timed out waiting for become success or become password prompt".
    #
    # Ubuntu still installs classic sudo alongside it as /usr/bin/sudo.ws, and
    # that one honours -p correctly, so we point become at it when we detect
    # the problem. On 22.04/24.04 neither condition holds and nothing changes.
    # ---------------------------------------------------------------------
    - name: Check which sudo implementation is in use
      ansible.builtin.command: sudo --version
      register: sudo_impl
      changed_when: false     # a query
      check_mode: false       # must run during --check too, or become breaks there
      failed_when: false      # absence of sudo is handled below, not here
      tags: [always]

    - name: Look for classic sudo alongside sudo-rs
      ansible.builtin.stat:
        path: /usr/bin/sudo.ws
      register: classic_sudo
      tags: [always]

    - name: Use classic sudo when sudo-rs would break privilege escalation
      ansible.builtin.set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      when:
        - "'sudo-rs' in (sudo_impl.stdout | default(''))"
        - classic_sudo.stat.exists
      tags: [always]

    - name: Warn if sudo-rs is in use with no classic sudo to fall back on
      ansible.builtin.fail:
        msg: |
          This machine uses sudo-rs, which does not reproduce the password
          prompt Ansible looks for, and classic sudo (/usr/bin/sudo.ws) is not
          installed to fall back on. Every privileged task would hang.

          Fix it with either of:
            sudo apt install -y sudo
            sudo update-alternatives --config sudo    # choose sudo.ws
      when:
        - "'sudo-rs' in (sudo_impl.stdout | default(''))"
        - not classic_sudo.stat.exists
      tags: [always]

    - name: Detect whether an NVIDIA GPU is physically present
      # Asking the hardware directly, so the same settings work on every
      # machine: a desktop with a card installs the driver, a laptop without
      # one skips it, and neither needs a per-machine file.
      #
      # /proc/bus/pci/devices rather than lspci, because lspci is not
      # installed on a minimal Ubuntu. Vendor 10de is NVIDIA.
      ansible.builtin.shell:
        cmd: "set -o pipefail; awk '{print $2}' /proc/bus/pci/devices | grep -qi '^{{ nvidia_pci_vendor_id }}' && echo present || echo absent"
        executable: /bin/bash
      register: nvidia_pci_probe
      changed_when: false     # a query changes nothing
      check_mode: false       # safe during --check; it only reads
      failed_when: false      # "no GPU" is an answer, not an error
      tags: [always]

    - name: Record whether NVIDIA hardware was found
      ansible.builtin.set_fact:
        nvidia_hardware_present: "{{ (nvidia_pci_probe.stdout | default('absent')) is search('present') }}"
      tags: [always]

    - name: Report which variable file was used
      ansible.builtin.debug:
        msg: >-
          Host '{{ ansible_facts['hostname'] }}' --
          NVIDIA GPU detected: {{ nvidia_hardware_present }}
          (NVIDIA roles {{ 'will run' if (nvidia_hardware_present | bool and nvidia_gpu_present | bool) else 'will be skipped' }}).
          Per-machine overrides are optional: drop them in
          host_vars/{{ ansible_facts['hostname'] }}.yml if you ever need them.
      tags: [always]

  roles:
    # Each role carries a tag so you can run just that part:
    #   ansible-playbook local.yml -K --tags keyboard
    # Multiple tags work too:
    #   ansible-playbook local.yml -K --tags packages,chrome

    - role: base
      tags: [base]

    - role: packages
      tags: [packages]

    - role: chrome
      tags: [chrome]
      when: install_chrome | bool

    - role: vscode
      tags: [vscode]
      when: install_vscode | bool

    - role: docker
      tags: [docker]
      when: install_docker | bool

    - role: nvidia
      tags: [nvidia]
      # Hardware detection decides, so one configuration works on every
      # machine. nvidia_gpu_present is only an off switch for a machine that
      # has a card but should not get the proprietary driver.
      when:
        - nvidia_gpu_present | bool
        - nvidia_hardware_present | bool

    # GPU containers. Only meaningful when BOTH Docker and an NVIDIA GPU are
    # present, which is why it is its own role rather than living inside
    # either one. Must run after both. Docker Engine alone cannot reach the
    # GPU -- `docker run --gpus all` fails without this.
    - role: nvidia_container
      tags: [nvidia_container, docker, nvidia]
      when:
        - install_docker | bool
        - nvidia_gpu_present | bool
        - nvidia_hardware_present | bool
        - install_nvidia_container | bool

    - role: mise
      tags: [mise]
      when: install_mise | bool

    - role: keyboard
      tags: [keyboard]
      when: configure_keyboard | bool

    # Always last: prints the checklist of things that genuinely cannot be
    # automated. Deliberately NOT tagged `always` -- if you run --tags docker
    # you want the docker output, not a full checklist.
    - role: manual_steps
      tags: [manual_steps]
