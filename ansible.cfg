# ---------------------------------------------------------------------------
# ansible.cfg -- Ansible reads this automatically when you run a command from
# this directory. It saves you from passing the same flags every single time.
#
# NOTE: Ansible only trusts an ansible.cfg in the current working directory if
# the directory is not world-writable. This repo is fine; just be aware that
# running from /tmp would silently ignore this file.
# ---------------------------------------------------------------------------
[defaults]
# Where to find the list of machines. See inventory/hosts.yml for why this
# repo deliberately contains only "localhost".
inventory = inventory/hosts.yml

# Look for roles next to this file, so `roles/base` etc. resolve.
roles_path = roles

# Stop Ansible printing a warning about which python it picked. On Ubuntu the
# answer is always /usr/bin/python3, so the warning is pure noise.
interpreter_python = auto_silent

# Don't scatter *.retry files around the repo after a failed run.
retry_files_enabled = False

# Show which tasks changed things at the end of a run.
display_skipped_hosts = False

# Fact caching is off on purpose: this playbook runs rarely, against one
# machine, and stale facts (e.g. a GPU that got added) would be a footgun.
gathering = smart

[privilege_escalation]
# We escalate with sudo only on the tasks that genuinely need root.
# Everything desktop-related runs as the invoking user -- see README.
become_method = sudo
